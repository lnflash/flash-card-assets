<svg xmlns="http://www.w3.org/2000/svg"
     width="91.6mm" height="59.98mm" viewBox="0 0 91.6 59.98">
  <!--
    Flash Card — Concept B "CIRCUIT", FRONT
    Back is identical to Concept A (concept-a-bearer-back.svg).

    ⚠ PRODUCTION NOTE — this concept centres the chip.
    The contact module's position is fixed by ISO/IEC 7816-2 and by the
    manufacturer's milling tooling; on most dual-interface stock it sits at the
    TOP-LEFT and cannot be moved to the centre. Read the centred element here as
    a PRINTED graphic that the real module does not occupy — or commission a
    custom module position and expect tooling cost and MOQ implications.
    Confirm before this concept is quoted. See SPECIFICATIONS.md § Chip.
  -->
  <defs>
    <clipPath id="trimC">
      <rect x="3" y="3" width="85.6" height="53.98" rx="3.18" ry="3.18"/>
    </clipPath>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f97316" stop-opacity="0.55"/>
      <stop offset="45%"  stop-color="#f97316" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="chipFaceB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#f7cf76"/>
      <stop offset="45%"  stop-color="#e8b355"/>
      <stop offset="100%" stop-color="#c9963f"/>
    </linearGradient>

    <!-- Traces fade out toward the card edge so nothing collides with trim. -->
    <linearGradient id="traceL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%"   stop-color="#f97316" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="traceR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f97316" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#trimC)">
    <rect x="0" y="0" width="91.6" height="59.98" fill="#080a0d"/>

    <!-- Glow behind the chip -->
    <ellipse cx="45.8" cy="29.99" rx="30" ry="22" fill="url(#glow)"/>

    <!-- ─── Circuit traces ─── -->
    <g stroke-width="0.28" fill="none">
      <line x1="6"    y1="29.99" x2="38"   y2="29.99" stroke="url(#traceL)"/>
      <line x1="53.6" y1="29.99" x2="85.6" y2="29.99" stroke="url(#traceR)"/>
      <line x1="10"   y1="21.5"  x2="38"   y2="21.5"  stroke="url(#traceL)" opacity="0.55"/>
      <line x1="53.6" y1="38.5"  x2="81"   y2="38.5"  stroke="url(#traceR)" opacity="0.55"/>
    </g>

    <!-- Diagonal rays -->
    <g stroke="#f97316" stroke-width="0.22" opacity="0.4">
      <line x1="24" y1="10"    x2="41.5" y2="26.5"/>
      <line x1="67" y1="49"    x2="50.5" y2="33.5"/>
      <line x1="24" y1="49"    x2="41.5" y2="33.5"/>
      <line x1="67" y1="10"    x2="50.5" y2="26.5"/>
    </g>

    <!-- Nodes -->
    <g fill="#f97316">
      <circle cx="16.5" cy="29.99" r="0.55" opacity="0.85"/>
      <circle cx="28"   cy="29.99" r="0.42" opacity="0.7"/>
      <circle cx="63.5" cy="29.99" r="0.55" opacity="0.85"/>
      <circle cx="75"   cy="29.99" r="0.42" opacity="0.7"/>
      <circle cx="24"   cy="10"    r="0.5"  opacity="0.75"/>
      <circle cx="10"   cy="21.5"  r="0.4"  opacity="0.5"/>
      <circle cx="81"   cy="38.5"  r="0.4"  opacity="0.5"/>
    </g>

    <!-- ─── Chip ─── centred; see production note above ─── -->
    <g>
      <rect x="39.3" y="24.09" width="13" height="11.8" rx="1" ry="1" fill="url(#chipFaceB)"/>
      <g stroke="#8a6524" stroke-width="0.22" opacity="0.75">
        <line x1="39.3" y1="27.99" x2="52.3" y2="27.99"/>
        <line x1="39.3" y1="31.99" x2="52.3" y2="31.99"/>
        <line x1="44"   y1="24.09" x2="44"   y2="27.99"/>
        <line x1="44"   y1="31.99" x2="44"   y2="35.89"/>
        <line x1="47.6" y1="24.09" x2="47.6" y2="35.89"/>
      </g>
    </g>

    <!-- ─── Contactless mark ─── top-right ─── -->
    <g transform="translate(74.5,13.5)" fill="none" stroke="#f97316" stroke-width="0.55" stroke-linecap="round" opacity="0.95">
      <path d="M 0 -2.6 A 3.4 3.4 0 0 1 0 2.6"/>
      <path d="M 2 -3.9 A 5.1 5.1 0 0 1 2 3.9"/>
      <path d="M 4 -5.2 A 6.8 6.8 0 0 1 4 5.2"/>
    </g>

    <!-- ─── Baseline rule ─── -->
    <line x1="9" y1="46.5" x2="82.6" y2="46.5" stroke="#f97316" stroke-width="0.15" opacity="0.3"/>

    <!-- ─── ₿ BITCOIN ECASH ─── bottom-left ─── -->
    <g font-family="Inter, 'Helvetica Neue', sans-serif">
      <text x="9" y="52.2" font-weight="700" font-size="2.9" fill="#f97316">₿</text>
      <text x="12.6" y="52" font-weight="500" font-size="1.75" letter-spacing="0.72" fill="#8e949d">BITCOIN ECASH</text>
    </g>

    <!-- ─── FLASH wordmark ─── UV spot gloss applies HERE ─── -->
    <g font-family="Inter, 'Helvetica Neue', sans-serif" text-anchor="end">
      <text x="82.6" y="51.2" font-weight="900" font-size="7.4" letter-spacing="0.15" fill="#ffffff">FLASH</text>
      <text x="82.6" y="54.4" font-weight="600" font-size="1.85" letter-spacing="1.5" fill="#f97316">BEARER</text>
    </g>
  </g>
</svg>
